name: Publish Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-huggingface-space
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade "huggingface_hub[cli]"

      - name: Publish Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload hw391/aipi540-sortsnap . . \
            --repo-type=space \
            --delete="*" \
            --exclude=".git/*" \
            --exclude=".github/*" \
            --exclude=".venv/*" \
            --exclude="venv/*" \
            --exclude="env/*" \
            --exclude=".env" \
            --exclude="__pycache__/*" \
            --exclude="*.pyc" \
            --exclude="data/raw/*" \
            --exclude="data/processed/*" \
            --exclude="outputs/*" \
            --exclude="feedback.csv" \
            --commit-message="Publish SortSnap Space"
